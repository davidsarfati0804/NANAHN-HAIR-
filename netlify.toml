# Branche site-2 : publie le NOUVEAU site (dossier na-nah-nhair/).
# Le premier site reste publié depuis la branche main, avec son propre netlify.toml.
[build]
  base = "na-nah-nhair"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Garde-fou (modification 39) : en production, le build est refusé tant qu'une information
# « À COMPLÉTER » reste dans les pages légales, les emails ou le pied de page.
[context.production]
  command = "npm run verifier:mise-en-ligne && npm run build"
