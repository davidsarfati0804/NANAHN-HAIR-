# Vérifie le site publié par Netlify depuis la branche site-2 (la session de développement n'a pas accès à Netlify).
name: Vérifier site-2 sur Netlify

on:
  push:
    branches: [site-2]
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Statut du dernier déploiement Netlify (badge public)
        run: |
          exec > >(tee -a rapport.txt) 2>&1
          curl -sS "https://api.netlify.com/api/v1/badges/1c82ca70-81d1-4e3e-81b5-35e4a64ac638/deploy-status?branch=site-2" -o badge-site2.svg || true
          curl -sS "https://api.netlify.com/api/v1/badges/1c82ca70-81d1-4e3e-81b5-35e4a64ac638/deploy-status" -o badge-main.svg || true
          echo "site-2 : $(grep -oiE 'success|failed|building|enqueued|canceled|skipped|not found|unknown' badge-site2.svg | head -1)"
          echo "main   : $(grep -oiE 'success|failed|building|enqueued|canceled|skipped|not found|unknown' badge-main.svg | head -1)"
      - name: Attendre que site-2 réponde (jusqu'à 12 minutes)
        run: |
          exec > >(tee -a rapport.txt) 2>&1
          URL="https://site-2--nanahnhair.netlify.app"
          for i in $(seq 1 48); do
            code=$(curl -s -o page.html -m 20 -w "%{http_code} %{time_total}" "$URL/" || echo "000 0")
            echo "essai $i : accueil $code"
            if [ "${code%% *}" = "200" ] && grep -q "Quel" page.html; then break; fi
            sleep 15
          done
          echo "--- en-têtes de l'accueil"
          curl -sS -I -m 20 "$URL/" | grep -iE "^HTTP|x-nf-request-id|server|cache-status|age" || true
          echo "--- /api/sante"
          curl -sS -m 30 "$URL/api/sante" || true
          echo
          echo "--- /api/sante?detail=1"
          curl -sS -m 40 "$URL/api/sante?detail=1" || true
          echo
          echo "--- pages (code, durée)"
          for p in / /soins /soins/fabulous /pack /boutique /quiz /mon-histoire /faq /contact /cgv /panier /admin/connexion /api/catalog /images/logo-na-nah-nhair.svg; do
            curl -s -o /dev/null -m 30 -w "$p %{http_code} %{time_total}s\n" "$URL$p" || echo "$p erreur"
          done
          echo "--- images (code, type, taille)"
          for p in "/images/logo-na-nah-nhair.jpg" "/images/logo-na-nah-nhair.svg" "/images/mode-emploi/etape1-application.png" \
                   "/_next/image?url=%2Fimages%2Flogo-na-nah-nhair.jpg&w=96&q=75" \
                   "/_next/image?url=%2Fimages%2Fmode-emploi%2Fetape1-application.png&w=384&q=75" \
                   "/_next/image?url=%2Fimages%2Fmode-emploi-fabulous%2Ficone-yeux.png&w=48&q=75"; do
            curl -s -o img.bin -m 30 -w "$p %{http_code} %{content_type} %{size_download}o\n" "$URL$p" || echo "$p erreur"
          done
          echo "--- balises img de /soins/miraculous"
          curl -s -m 30 "$URL/soins/miraculous" | grep -oE '<img[^>]*>' | grep -oE 'src="[^"]*"' | head -8
          echo "--- contenus des modifications 11 à 28 (OK = trouvé dans la page en ligne)"
          check() { if curl -s -m 30 "$URL$1" | grep -q "$2"; then echo "OK      $1 : $2"; else echo "ABSENT  $1 : $2"; fi; }
          check / "Quel soin est le tien"
          check / "chaque personnalité, son soin"
          check / "Créés par une naturopathe"
          check / "retour à l&#x27;accueil"
          check /boutique "/images/produits/fabulous-800.jpg"
          check / "la repousse et ralentir la chute"
          check /soins "Quel soin est le tien"
          check /soins/fabulous "vitamine E"
          check /quiz/resultat/luxurious "Je suis Luxurious"
          check /quiz/resultat/luxurious "Ton résultat"
          check /faq "Contact@nanahnhair.com"
          check /faq "Usage externe uniquement"
          check /faq "3 pipettes"
          check /guide-de-style "Les 4 choix"
          check / "snap-mandatory"
          check / "fabulous-detoure-240.webp"
          check /mon-histoire "Tout a commencé sur mon bureau"
          check /boutique ">Hair Serum<"
          check /cgv "v1. Dernière mise à jour"
          check /retractation "Modèle de formulaire de rétractation"
          check / "Touche un flacon"
          check /commande "Commander et payer"
          check /boutique "grid-cols-2 gap-3"
          check /soins/fabulous "fixed inset-x-0 bottom-0"
          check /soins/fabulous "<details"
          for p in /documents/cgv-v1.pdf /documents/formulaire-de-retractation.pdf /story/luxurious.png /images/produits/pack-800.webp /quiz/resultat/fabulous /quiz/resultat/miraculous; do
            curl -s -o /dev/null -m 30 -w "$p %{http_code} %{content_type}\n" "$URL$p" || echo "$p erreur"
          done
          echo "--- en-tête CSP"
          curl -sS -I -m 20 "$URL/" | grep -i content-security-policy || true
          echo "--- début de l'accueil"
          head -c 600 page.html || true
      - name: Publier le rapport (annotation)
        if: always()
        run: |
          r=$(tr -d '\r' < rapport.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::notice title=Rapport site-2::${r:0:60000}"
