# Publie la boutique NA NAH N'HAIR (dossier na-nah-nhair/).
# Jusqu'à la mise en ligne, la branche main garde l'ancien site (archivé en ZIP le 28/10/2026).
[build]
  base = "na-nah-nhair"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Garde-fou (modification 39) : en production, le build est refusé tant qu'une information
# « À COMPLÉTER » reste dans les pages légales, les emails ou le pied de page.
[context.production]
  command = "npm run verifier:mise-en-ligne && npm run build"
