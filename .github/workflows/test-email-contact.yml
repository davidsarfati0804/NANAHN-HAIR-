# Test d'envoi d'email : remplit le formulaire de contact du vrai site comme une visiteuse.
# (relance : 3) Le site doit envoyer l'alerte « Nouveau message » à la boîte de la boutique (SMTP OVH).
name: Test email (formulaire de contact)

on:
  push:
    branches: [site-2]
    paths: [.github/workflows/test-email-contact.yml]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Navigateur
        run: |
          npm init -y > /dev/null
          npm install playwright@1.56.1 > install.txt 2>&1 || echo "npm install en échec" >> erreurs.txt
          npx playwright install --with-deps chromium >> install.txt 2>&1 || echo "installation du navigateur en échec" >> erreurs.txt
      - name: Envoi du formulaire
        env:
          EMAIL: contact@ge-mesdocs.fr
        run: |
          cat > test.mjs <<'JS'
          import { chromium } from "playwright";
          const browser = await chromium.launch();
          const page = await browser.newPage();
          await page.addInitScript(() => localStorage.setItem("nnh-consentement", "refuse"));
          await page.goto("https://nanahnhair.com/contact", { waitUntil: "networkidle" });
          await page.getByLabel("Nom").fill("Test technique du site");
          await page.getByLabel("Email").fill(process.env.EMAIL);
          await page.getByLabel("Sujet").selectOption("Autre");
          await page.getByLabel("Message").fill("Test d'envoi d'email depuis le site nanahnhair.com (message automatique, à ignorer).");
          await page.waitForTimeout(4000);
          await page.getByRole("button", { name: "Envoyer" }).click();
          await page.waitForTimeout(8000);
          const status = (await page.getByRole("status").first().textContent()) ?? "";
          console.log(`Réponse du site : ${status.trim() || "(vide)"}`);
          await browser.close();
          JS
          node test.mjs > rapport.txt 2>&1 || echo "(script en échec)" >> rapport.txt
          cat erreurs.txt >> rapport.txt 2>/dev/null || true
          tail -5 install.txt >> rapport.txt 2>/dev/null || true
          echo "::notice title=Test email::$(tr -d '\r' < rapport.txt | head -c 3000 | tr '\n' ' ')"
