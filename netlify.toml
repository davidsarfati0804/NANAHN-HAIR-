# Publie la boutique NA NAH N'HAIR (dossier na-nah-nhair/).
# En production depuis le 01/11/2026 (branche main) ; ancien site archivé en ZIP et marqué par le tag ancien-site.
[build]
  base = "na-nah-nhair"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Garde-fou (modification 39) : liste les informations « À COMPLÉTER ». Depuis la mise en ligne confirmée le
# 01/11/2026, simple avertissement (--avertir) ; retirer --avertir une fois la liste vide.
[context.production]
  command = "npm run verifier:mise-en-ligne -- --avertir && npm run build"
