# Commande d'essai sur le vrai site, en MODE TEST Stripe (carte 4242, aucun argent réel) — relance 4 :
# commande, page de paiement Stripe, retour sur le site, confirmation du paiement (webhook), email.
name: Test paiement (mode test Stripe)

on:
  push:
    branches: [site-2]
    paths: [.github/workflows/test-paiement.yml]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Navigateur
        run: |
          npm init -y > /dev/null
          npm install playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Commande d'essai
        env:
          EMAIL: contact@ge-mesdocs.fr
        run: |
          cat > test.mjs <<'JS'
          import { chromium } from "playwright";
          const log = (m) => console.log(m);
          const site = "https://nanahnhair.com";
          const cat = await (await fetch(`${site}/api/catalog`)).json();
          log(`Paiement actif sur le site : ${cat.paymentEnabled}`);
          const browser = await chromium.launch();
          const page = await browser.newPage({ locale: "fr-FR" });
          try {
            await page.addInitScript(() => {
              localStorage.setItem("nnh-consentement", "refuse");
              if (!sessionStorage.getItem("panier-test")) {
                localStorage.setItem("nnh-panier-v1", JSON.stringify([{ id: "fabulous", quantity: 1 }]));
                sessionStorage.setItem("panier-test", "1");
              }
            });
            await page.goto(`${site}/commande`, { waitUntil: "networkidle" });
            await page.getByLabel("Colissimo").check();
            for (const [label, value] of [["Prénom", "Test"], ["Nom", "Paiement"], ["Email", process.env.EMAIL], ["Adresse", "24 rue Octave Feuillet"], ["Code postal", "75116"], ["Ville", "Paris"]])
              await page.getByLabel(label, { exact: true }).fill(value);
            await page.getByRole("checkbox", { name: /conditions générales de vente/ }).check();
            await page.waitForTimeout(1500);
            await page.getByRole("button", { name: "Commander et payer" }).click();
            await page.waitForURL(/checkout\.stripe\.com/, { timeout: 30000 });
            log(`Page de paiement Stripe ouverte : ${new URL(page.url()).host}`);
            await page.waitForTimeout(4000);
            const fill = async (sel, v) => { const l = page.locator(sel); if (await l.count()) await l.first().fill(v); };
            await fill("#cardNumber", "4242424242424242");
            await fill("#cardExpiry", "12 / 34");
            await fill("#cardCvc", "123");
            await fill("#billingName", "Test Paiement");
            await fill("#billingPostalCode", "75116");
            const total = await page.locator('[data-testid="product-summary-total-amount"], #OrderDetails-TotalAmount').first().textContent().catch(() => "?");
            log(`Montant affiché par Stripe : ${total}`);
            // Paiement en euros (le robot de test est aux États-Unis : Stripe propose aussi le dollar)
            const eur = page.getByText("19,90 €", { exact: true }).first();
            if (await eur.count()) await eur.click().catch(() => {});
            // Case « enregistrer mes informations avec Link » : décochée (sinon Stripe exige un téléphone)
            const link = page.locator("#enableStripePass");
            if (await link.count() && (await link.isChecked().catch(() => false))) await link.uncheck({ force: true }).catch(() => {});
            const fields = await page.locator("input, select").evaluateAll((els) => els.filter((e) => e.offsetParent).map((e) => `${e.id || e.name}=${e.tagName === "SELECT" ? e.value : e.value ? "rempli" : "vide"}`));
            log(`Champs visibles : ${fields.join(", ")}`);
            await page.locator('button[type="submit"]').first().click();
            try {
              await page.waitForURL(/nanahnhair\.com\/commande\/confirmee/, { timeout: 45000 });
            } catch (e) {
              const alerts = await page.locator('[role="alert"], .FieldError, [class*="Error"]').allInnerTexts().catch(() => []);
              log(`Messages d'erreur Stripe : ${alerts.filter(Boolean).join(" | ") || "(aucun)"}`);
              const frames = page.frames().map((f) => new URL(f.url() || "about:blank").host).filter(Boolean);
              log(`Cadres présents : ${[...new Set(frames)].join(", ")}`);
              log(`Texte du bas de page : ${(await page.locator("body").innerText()).replace(/\s+/g, " ").slice(-500)}`);
              throw e;
            }
            log("Retour sur le site après paiement : OK");
            for (let i = 0; i < 6; i++) {
              const text = await page.locator("main").innerText();
              if (/paiement est confirmé/.test(text)) { log(`Page de confirmation : ${text.replace(/\s+/g, " ").slice(0, 220)}`); break; }
              if (i === 5) log(`Page de confirmation (paiement pas encore confirmé par le webhook) : ${text.replace(/\s+/g, " ").slice(0, 220)}`);
              await page.waitForTimeout(5000);
              await page.reload({ waitUntil: "networkidle" });
            }
          } catch (e) {
            log(`ERREUR à l'adresse ${page.url()} : ${e.message.split("\n")[0]}`);
            const body = await page.locator("body").innerText().catch(() => "");
            log(`Texte visible : ${body.replace(/\s+/g, " ").slice(0, 400)}`);
          }
          await browser.close();
          JS
          node test.mjs > rapport.txt 2>&1 || echo "(script en échec)" >> rapport.txt
          echo "::notice title=Test paiement::$(tr -d '\r' < rapport.txt | head -c 3500 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
