# Diagnostic du nom de domaine (DNS, HTTPS, réponse du site, réglages, relance 3) : la session de développement n'a pas accès au web.
name: Diagnostic domaine

on:
  push:
    branches: [site-2]
    paths: [.github/workflows/diagnostic-domaine.yml]
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DNS, HTTP, HTTPS
        run: |
          exec > >(tee -a rapport.txt) 2>&1
          sudo apt-get install -y -qq dnsutils > /dev/null 2>&1 || true
          for d in nanahnhair.com www.nanahnhair.com; do
            echo "=== $d"
            for t in A AAAA CNAME NS CAA; do echo "$t : $(dig +short $t $d @1.1.1.1 | tr '\n' ' ')"; done
            echo "A (8.8.8.8) : $(dig +short A $d @8.8.8.8 | tr '\n' ' ')"
          done
          echo "MX : $(dig +short MX nanahnhair.com @1.1.1.1 | tr '\n' ' ')"
          echo "NS autoritaires : $(dig +short NS nanahnhair.com | tr '\n' ' ')"
          for u in http://nanahnhair.com http://www.nanahnhair.com https://nanahnhair.com https://www.nanahnhair.com; do
            echo "--- $u"
            curl -sS -o /dev/null -m 20 -w "code %{http_code} → %{redirect_url} (IP %{remote_ip})\n" "$u" || true
            curl -sS -I -m 20 "$u" 2>&1 | grep -iE "^HTTP|^server|^location|x-nf-request-id" || true
          done
          for h in nanahnhair.com www.nanahnhair.com; do
            echo "--- certificat $h"
            echo | timeout 15 openssl s_client -servername $h -connect $h:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1 | head -8 || true
          done
          echo "--- contenu (nouveau site ?)"
          for c in "/|Quel soin est le tien" "/boutique|HAIR SERUM" "/page-inexistante|Page introuvable" "/a-propos|Tout a commencé"; do
            p="${c%%|*}"; t="${c#*|}"
            if curl -sSL -m 20 "https://nanahnhair.com$p" | grep -q "$t"; then echo "OK      $p : $t"; else echo "ABSENT  $p : $t"; fi
          done
          echo "robots.txt : $(curl -sS -m 20 https://nanahnhair.com/robots.txt | tr '\n' ' ')"
          echo "accueil, consigne aux moteurs : $(curl -sS -m 20 https://nanahnhair.com/ | grep -o '<meta name="robots"[^>]*>' || echo 'aucune (indexable)')"
          for u in https://nanahnhair.netlify.app/ https://nanahnhair.netlify.app/a-propos https://nanahnhair.netlify.app/boutique; do
            echo "ancienne adresse $u → $(curl -s -o /dev/null -m 20 -w '%{http_code} %{redirect_url}' "$u")"
          done
          echo "api/sante : $(curl -sS -m 20 https://nanahnhair.com/api/sante)"
          echo "--- début de la page"
          curl -sSL -m 20 https://www.nanahnhair.com/ 2>&1 | head -c 400 || true
      - name: Rapport
        if: always()
        run: |
          r=$(tr -d '\r' < rapport.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::notice title=Diagnostic domaine::${r:0:60000}"
