# Configuration lue quand Netlify construit depuis le dossier na-nah-nhair (voir aussi ../netlify.toml)
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Garde-fou (modification 39) : depuis la mise en ligne confirmée le 01/11/2026, simple avertissement (--avertir)
# tant que les derniers « À COMPLÉTER » sont finis sur le site réel
[context.production]
  command = "npm run verifier:mise-en-ligne -- --avertir && npm run build"
