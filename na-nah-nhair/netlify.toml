# Site Netlify n°2 (nouveau site). Dans Netlify, régler « Base directory » sur na-nah-nhair
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Garde-fou (modification 39) : build de production refusé tant qu'il reste des « À COMPLÉTER »
[context.production]
  command = "npm run verifier:mise-en-ligne && npm run build"
